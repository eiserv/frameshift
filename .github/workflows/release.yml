name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release-please:
    if: vars.FRAMESHIFT_RELEASE_APP_READY == 'true'
    # The App key is an environment secret that only main may deploy with.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.FRAMESHIFT_RELEASE_APP_ID }}
          private-key: ${{ secrets.FRAMESHIFT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: frameshift
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: ${{ vars.FRAMESHIFT_M1_RELEASE_READY != 'true' }}
  package:
    needs: release-please
    if: needs.release-please.outputs.created == 'true' && vars.FRAMESHIFT_M1_RELEASE_READY == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.release-please.outputs.tag }}
      publish: true
  upload:
    needs: [release-please, package]
    if: needs.release-please.outputs.created == 'true' && vars.FRAMESHIFT_M1_RELEASE_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-with-checksums
          path: archives
      - name: Upload verified assets to the existing private release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ needs.release-please.outputs.tag }}
        run: |
          test "$(gh repo view --json isPrivate --jq .isPrivate)" = true
          (cd archives && sha256sum --check frameshift-*-checksums.txt)
          gh release view "$RELEASE_REF"
          gh release upload "$RELEASE_REF" archives/* --clobber
