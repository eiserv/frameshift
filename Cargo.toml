[workspace]
members = [
    "crates/frameshift-core",
    "crates/frameshift-transform",
    "crates/frameshift-engine",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
wildcard_enum_match_arm = "deny"

[profile.release]
panic = "unwind"
