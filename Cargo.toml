[workspace]
members = [
    "crates/frameshift-cli",
    "crates/frameshift-core",
    "crates/frameshift-input",
    "crates/frameshift-package",
    "crates/frameshift-nextjs",
    "crates/frameshift-modules",
    "crates/frameshift-bindings",
    "crates/frameshift-evaluate",
    "crates/frameshift-syntax",
    "crates/frameshift-transform",
    "crates/frameshift-emit",
    "crates/frameshift-engine",
    "tools/frameshift-bench",
    "tools/frameshift-corpus",
    "tools/frameshift-e2",
    "tools/frameshift-fuzz",
    "tools/frameshift-fuzz-sections",
    "tools/frameshift-entity-gen",
    "tools/frameshift-unicode-gen",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
license = "AGPL-3.0-or-later"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
wildcard_enum_match_arm = "deny"

[profile.release]
panic = "unwind"
