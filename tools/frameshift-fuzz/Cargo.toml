[package]
name = "frameshift-fuzz"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
frameshift-corpus = { path = "../frameshift-corpus" }
frameshift-engine = { path = "../../crates/frameshift-engine" }
frameshift-fuzz-sections = { path = "../frameshift-fuzz-sections" }

# The coverage runtime defines the SanitizerCoverage callback with the unsafe
# attribute `no_mangle` and copies the counters through raw pointers, so this
# development tool cannot inherit the workspace's `forbid`. It repeats the
# other workspace lints unchanged and confines unsafe code to one module
# (D-044).
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
wildcard_enum_match_arm = "deny"
undocumented_unsafe_blocks = "deny"
